<text x="62" y="565" font-size="21" font-weight="700">Не восстановлено из кода</text>
<text x="62" y="598" font-size="17">Питание платы и LED, напряжение/ток, разводка GND, преобразование уровней,</text>
<text x="62" y="626" font-size="17">защитные компоненты и номиналы. Схема не задаёт готовый силовой монтаж.</text>
<text x="62" y="654" font-size="15">Перед подключением сверить фактические плату, матрицу и направление DIN/DOUT.</text>
<text x="40" y="704" font-size="13" fill="#526c7c">Источники: forArduinoMatrix.ino, parser/parser.ino, main.py, qt_app/serial_config.py. Аппаратная проверка не выполнялась.</text>
