<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Arduino Matrix: сигнальная схема WS2812 10×10</title>
<desc id="desc">Компьютер передаёт команды Serial 9600 плате Arduino, вывод 5 передаёт данные DIN матрице 100 WS2812. Номера питания, напряжения, модель платы и защитные компоненты неизвестны. Нумерация змейкой показана по main.py.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#237e9d"/></marker></defs>
<rect width="1200" height="720" rx="20" fill="#f3f7fb"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#16334b">
<text x="40" y="52" font-size="28" font-weight="700">ARDUINO MATRIX / WS2812 10 × 10</text>
<text x="40" y="86" font-size="17">Сигнальные связи по исходникам; монтаж и питание требуют проверки</text>
<g fill="white" stroke="#98b6c8" stroke-width="2"><rect x="40" y="155" width="265" height="255" rx="14"/><rect x="390" y="155" width="310" height="255" rx="14"/><rect x="820" y="125" width="340" height="340" rx="14"/></g>
<text x="62" y="194" font-size="20" font-weight="700">Компьютер / Windows</text>
<text x="62" y="235" font-size="18">Qt tray: режимы S / E</text><text x="62" y="266" font-size="17">WASAPI → эквалайзер</text><text x="62" y="297" font-size="17">Spotify → обложка</text><text x="62" y="341" font-size="17">MATRIX_PORT / COM8</text><text x="62" y="374" font-size="15">Отдельно: редактор res.h</text>
<text x="412" y="194" font-size="23" font-weight="700">Плата Arduino</text><text x="412" y="232" font-size="17">Модель платы не задана</text><text x="412" y="265" font-size="17">parser/parser.ino</text><text x="412" y="298" font-size="17">FastLED · WS2812 · GRB</text><text x="412" y="339" font-size="19" font-weight="700">LED_PIN = 5</text><text x="412" y="374" font-size="16">ACK: один байт d</text>
